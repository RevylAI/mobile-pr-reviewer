# Revyl CLI Configuration
# Generated by: revyl init

project:
    name: bug-bazaar
    org_id: 177091bf-5404-45d2-a623-ecefd2b43519
build:
    system: Expo
    command: npx --yes eas-cli build --platform ios --profile development-simulator --local --output build/dev-ios.tar.gz
    output: build/dev-ios.tar.gz
    platforms:
        android-ci:
            command: npx --yes eas-cli build --platform android --profile preview --local --output build/ci-android.apk
            output: build/ci-android.apk
            app_id: c462d064-7651-4fda-ae72-c3723c4d60d0
        android-dev:
            command: npx --yes eas-cli build --platform android --profile development --local --output build/dev-android.apk
            output: build/dev-android.apk
            app_id: e0f1befa-c0c0-48ab-a330-910463b25a5c
        ios-ci:
            command: npx --yes eas-cli build --platform ios --profile preview-simulator --local --output build/ci-ios.tar.gz
            output: build/ci-ios.tar.gz
            app_id: 6ba5ab91-9b30-4af8-bac7-e5f4e8ed0f31
        ios-dev:
            command: npx --yes eas-cli build --platform ios --profile development-simulator --local --output build/dev-ios.tar.gz
            output: build/dev-ios.tar.gz
            app_id: afe41c83-6d4c-426a-b83d-8d752cc10ca5
defaults:
    open_browser: true
    timeout: 600
hotreload:
    default: expo
    providers:
        expo:
            port: 8081
            app_scheme: bug-bazaar
            platform_keys:
                android: android-dev
                ios: ios-dev
