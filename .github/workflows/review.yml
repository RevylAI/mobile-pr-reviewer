name: Mobile PR Review
on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

# Newer commits / comments on the same PR cancel in-flight runs.
concurrency:
  group: mobile-pr-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

# ============================================================================
# Mobile PR Reviewer
# ============================================================================
# Two main jobs the customer can mix and match:
#
#   1. build         — build the app and upload to Revyl. Runs on every
#                      pull_request. Builds android+ios in parallel by default;
#                      edit `strategy.matrix.platform` to drop one.
#
#   2. review        — DEFAULT. Claude drives the device with raw
#                      tap/swipe/screenshot in a vision loop (CLAUDE.md).
#                      Runs on every PR open and on `/review` comments.
#                      Matrix-fans-out across platforms in parallel.
#
#   3. test-review   — OPTIONAL. Triggers an existing Revyl test or workflow
#                      against the PR build (CLAUDE-test.md). Triggered only
#                      by `/test` comments. Skips silently if neither
#                      REVYL_TEST_NAME nor REVYL_WORKFLOW_NAME is set.
#
# CUSTOMIZATION GUIDE
# -------------------
# - Drop a platform: edit `strategy.matrix.platform` in build / review
#   to e.g. `[android]` or `[ios]`.
# - Disable the trigger-existing-test mode: delete the test-review job
#   (or just leave REVYL_TEST_NAME / REVYL_WORKFLOW_NAME unset).
# - Disable the reactive review on PR open and only run it on /review:
#   change the `if:` on the review job to drop the pull_request branch.
#
# REQUIRED SECRETS
# ----------------
#   ANTHROPIC_API_KEY      — console.anthropic.com
#   REVYL_API_KEY          — app.revyl.ai → Settings → API Keys
#   REVYL_APP_ID_ANDROID   — `revyl app create --name "myapp" --platform android --json`
#   REVYL_APP_ID_IOS       — `revyl app create --name "myapp" --platform ios --json`
#   EXPO_TOKEN             — only if your build step needs Expo auth
#                            (the bundled sample app does)
#
# OPTIONAL SECRETS / VARIABLES
# ----------------------------
#   REVYL_TEST_NAME        — name of an existing Revyl test to trigger on /test
#   REVYL_WORKFLOW_NAME    — name of an existing Revyl workflow to trigger on /test
#   (set exactly one; leave both unset to disable the test-review job)
#
# If you only support one platform, set only that platform's REVYL_APP_ID_*
# secret and drop the other from the matrices below.
# ============================================================================

jobs:
  # ------------------------------------------------------------------
  # build — builds and uploads each platform's binary to Revyl, emits
  # a per-platform build_version_id that downstream jobs pin to.
  # ------------------------------------------------------------------
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [android, ios]   # ← edit this list to drop a platform
    outputs:
      android_build_version_id: ${{ steps.export.outputs.android }}
      ios_build_version_id: ${{ steps.export.outputs.ios }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: sample-app
        run: npm ci

      # ------------------------------------------------------------------
      # Customize this step for your build system (Gradle, Xcode, Flutter,
      # native iOS, native Android, etc.). The sample uses Expo + EAS local
      # builds.
      # ------------------------------------------------------------------
      - name: Build app
        id: build
        working-directory: sample-app
        run: |
          set -euo pipefail
          if [ "${{ matrix.platform }}" = "android" ]; then
            npx --yes eas-cli build \
              --platform android --profile preview \
              --local --output build/app.apk --non-interactive
            echo "artifact=sample-app/build/app.apk" >> "$GITHUB_OUTPUT"
          else
            npx --yes eas-cli build \
              --platform ios --profile preview-simulator \
              --local --output build/app.tar.gz --non-interactive
            echo "artifact=sample-app/build/app.tar.gz" >> "$GITHUB_OUTPUT"
          fi
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Install Revyl CLI
        run: pip install revyl

      - name: Upload build to Revyl (capture build_version_id)
        id: upload
        run: |
          set -euo pipefail
          if [ "${{ matrix.platform }}" = "android" ]; then
            app_id="${REVYL_APP_ID_ANDROID:-}"
          else
            app_id="${REVYL_APP_ID_IOS:-}"
          fi
          if [ -z "$app_id" ]; then
            echo "::error::REVYL_APP_ID_${{ matrix.platform }} secret is not set"
            exit 1
          fi
          out=$(revyl build upload \
            --skip-build \
            --platform "${{ matrix.platform }}" \
            --app "$app_id" \
            --file "${{ steps.build.outputs.artifact }}" \
            --json --yes)
          echo "$out"
          bid=$(echo "$out" | jq -r '.builds[0].build_id // .build.build_id // empty')
          if [ -z "$bid" ]; then
            echo "::error::Failed to extract build_version_id from revyl build upload output"
            exit 1
          fi
          echo "build_version_id=$bid" >> "$GITHUB_OUTPUT"
        env:
          REVYL_API_KEY: ${{ secrets.REVYL_API_KEY }}
          REVYL_APP_ID_ANDROID: ${{ secrets.REVYL_APP_ID_ANDROID }}
          REVYL_APP_ID_IOS: ${{ secrets.REVYL_APP_ID_IOS }}

      # Stash the per-platform build_version_id as a job-level output via a
      # scratch step (matrix outputs in actions are awkward; this is the
      # idiomatic workaround).
      - name: Export per-platform build_version_id
        id: export
        run: |
          if [ "${{ matrix.platform }}" = "android" ]; then
            echo "android=${{ steps.upload.outputs.build_version_id }}" >> "$GITHUB_OUTPUT"
          else
            echo "ios=${{ steps.upload.outputs.build_version_id }}" >> "$GITHUB_OUTPUT"
          fi

  # ------------------------------------------------------------------
  # review — DEFAULT. Claude drives the device with a reactive vision
  # loop using raw revyl device tap / swipe / screenshot / type.
  # See CLAUDE.md. Runs on PR open and re-runs on /review comments.
  # Fans out across platforms in parallel.
  # ------------------------------------------------------------------
  review:
    needs: build
    if: |
      github.event_name == 'pull_request' || (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        startsWith(github.event.comment.body, '/review') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
    strategy:
      fail-fast: false
      matrix:
        platform: [android, ios]   # ← edit this list to drop a platform
    env:
      REVYL_API_KEY: ${{ secrets.REVYL_API_KEY }}
      REVYL_PLATFORM: ${{ matrix.platform }}
      PR_BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout PR branch (comment-triggered re-review)
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr checkout ${{ github.event.issue.number }}

      - name: Resolve PR base ref (for comment trigger)
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=$(gh pr view ${{ github.event.issue.number }} --json baseRefName -q .baseRefName)
          echo "PR_BASE_REF=$base" >> "$GITHUB_ENV"
          git fetch origin "$base":"refs/remotes/origin/$base" --depth=50 || true

      - name: Set per-platform Revyl env
        run: |
          if [ "${{ matrix.platform }}" = "android" ]; then
            echo "REVYL_APP_ID=${{ secrets.REVYL_APP_ID_ANDROID }}" >> "$GITHUB_ENV"
            echo "REVYL_BUILD_VERSION_ID=${{ needs.build.outputs.android_build_version_id }}" >> "$GITHUB_ENV"
          else
            echo "REVYL_APP_ID=${{ secrets.REVYL_APP_ID_IOS }}" >> "$GITHUB_ENV"
            echo "REVYL_BUILD_VERSION_ID=${{ needs.build.outputs.ios_build_version_id }}" >> "$GITHUB_ENV"
          fi

      - name: Install Revyl CLI
        run: pip install revyl

      - name: Claude PR review (${{ matrix.platform }})
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          trigger_phrase: "/review"
          prompt: |
            You are a mobile PR review bot. Read CLAUDE.md for full instructions.

            Environment variables already set for you:
              REVYL_API_KEY            — Revyl auth
              REVYL_APP_ID             — Revyl app id for this platform
              REVYL_BUILD_VERSION_ID   — pin with --build-version-id
              REVYL_PLATFORM           — ${{ matrix.platform }}
              PR_BASE_REF              — the PR's base branch (use for diffs)

            You drive the device with a REACTIVE LOOP using ONLY raw revyl
            device commands (tap, swipe, screenshot, type). NO `instruction`
            or `validation` — those use Revyl's higher-level planner; this
            template is built around YOU being the planner.

            Post a concise PR comment whose ONLY evidence is the session
            recording link. Always run `revyl device stop --all --json` at
            the end.
          claude_args: >-
            --model claude-sonnet-4-5
            --allowed-tools "Bash Read Glob Grep Write"

      - name: Cleanup device sessions
        if: always()
        run: revyl device stop --all --json || true

  # ------------------------------------------------------------------
  # test-review — OPTIONAL. Triggers an existing Revyl test or workflow
  # against the PR build. See CLAUDE-test.md.
  # Skips silently if neither REVYL_TEST_NAME nor REVYL_WORKFLOW_NAME
  # is set as a repo secret.
  # ------------------------------------------------------------------
  test-review:
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/test') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      REVYL_API_KEY: ${{ secrets.REVYL_API_KEY }}
      # Default to android for the app id; flip to ios if your existing
      # Revyl test/workflow targets iOS.
      REVYL_APP_ID: ${{ secrets.REVYL_APP_ID_ANDROID }}
      REVYL_TEST_NAME: ${{ secrets.REVYL_TEST_NAME }}
      REVYL_WORKFLOW_NAME: ${{ secrets.REVYL_WORKFLOW_NAME }}
      PR_BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
    steps:
      - name: Skip if no Revyl test/workflow configured
        id: gate
        run: |
          if [ -z "$REVYL_TEST_NAME" ] && [ -z "$REVYL_WORKFLOW_NAME" ]; then
            echo "Neither REVYL_TEST_NAME nor REVYL_WORKFLOW_NAME is set — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          fetch-depth: 0

      - name: Install Revyl CLI
        if: steps.gate.outputs.skip != 'true'
        run: pip install revyl

      - name: Claude trigger Revyl test/workflow
        if: steps.gate.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          trigger_phrase: "/test"
          prompt: |
            You are a mobile PR review bot in TRIGGER mode. Read CLAUDE-test.md for full instructions.

            Environment variables already set for you:
              REVYL_API_KEY        — Revyl auth
              REVYL_APP_ID         — the Revyl app to target
              REVYL_TEST_NAME      — name of an existing Revyl test (may be empty)
              REVYL_WORKFLOW_NAME  — name of an existing Revyl workflow (may be empty)
              PR_BASE_REF          — the PR's base branch (you almost certainly don't need it)

            You do NOT design a test here. You do NOT call any `revyl device`
            commands. Your only job is to:
              1. Pick which to run: workflow if REVYL_WORKFLOW_NAME is set,
                 otherwise test if REVYL_TEST_NAME is set.
              2. `revyl test run "$REVYL_TEST_NAME" --json --verbose`
                 OR `revyl workflow run "$REVYL_WORKFLOW_NAME" --json`
              3. Parse `report_link` from the JSON output.
              4. Post a short PR comment with the report link.
          claude_args: >-
            --model claude-sonnet-4-5
            --allowed-tools "Bash Read Glob Grep Write"
