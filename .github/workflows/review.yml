name: Mobile PR Review
on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      build-path: ${{ steps.build.outputs.path }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Install dependencies
      - name: Install dependencies
        working-directory: sample-app
        run: npm ci

      # Build the app
      # NOTE: Customize this step for your build system (Gradle, Xcode, Flutter, etc.)
      - name: Build app
        id: build
        working-directory: sample-app
        run: |
          npx --yes eas-cli build --platform android --profile preview --local --output build/app.apk --non-interactive
          echo "path=sample-app/build/app.apk" >> "$GITHUB_OUTPUT"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: sample-app/build/app.apk

  # Mode 1: Interactive Review (auto on PR, re-trigger with /review comment)
  # Claude boots a live cloud device, navigates to changed screens, and posts screenshots
  review:
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: app-build
          path: build/

      # Install Revyl CLI
      - name: Install Revyl CLI
        run: pip install revyl

      # Upload build to Revyl
      - name: Upload build to Revyl
        run: |
          revyl build upload \
            --skip-build \
            --platform android \
            --app "$REVYL_APP_ID" \
            --file build/app.apk \
            --json --yes
        env:
          REVYL_API_KEY: ${{ secrets.REVYL_API_KEY }}
          REVYL_APP_ID: ${{ secrets.REVYL_APP_ID }}

      # Claude reviews the PR on a live device
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: claude-sonnet-4-20250514
          trigger_phrase: "/review"
          direct_prompt: |
            You are a mobile PR review bot. Read CLAUDE.md for your full instructions.

            The app build has been uploaded to Revyl (app ID: ${{ secrets.REVYL_APP_ID }}).
            Use the revyl CLI to start a device, validate the PR changes, and report back.

            The revyl CLI is already installed and REVYL_API_KEY is set in the environment.
          allowed_tools: "Bash,Read,Glob,Grep,Write"
        env:
          REVYL_API_KEY: ${{ secrets.REVYL_API_KEY }}
          REVYL_APP_ID: ${{ secrets.REVYL_APP_ID }}

  # Mode 2: E2E Test Review (trigger with /test comment)
  # Claude creates a YAML test from the diff, runs it on Revyl, and posts the report link
  test-review:
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/test')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Checkout the PR branch for accurate diff analysis
      - name: Checkout PR branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr checkout ${{ github.event.issue.number }}

      # Install Revyl CLI
      - name: Install Revyl CLI
        run: pip install revyl

      # Claude creates an E2E test, runs it, and shares the report
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: claude-sonnet-4-20250514
          trigger_phrase: "/test"
          direct_prompt: |
            You are a mobile PR review bot in TEST MODE. Read CLAUDE-test.md for your full instructions.

            The app build has already been uploaded to Revyl (app ID: ${{ secrets.REVYL_APP_ID }}).
            Create an E2E test based on the PR diff, run it on Revyl's cloud platform,
            and post the shareable report link.

            The revyl CLI is already installed and REVYL_API_KEY is set in the environment.
            Run revyl commands from the sample-app/ directory.
          allowed_tools: "Bash,Read,Glob,Grep,Write"
        env:
          REVYL_API_KEY: ${{ secrets.REVYL_API_KEY }}
          REVYL_APP_ID: ${{ secrets.REVYL_APP_ID }}
